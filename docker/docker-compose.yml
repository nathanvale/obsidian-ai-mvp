version: '3.8'

services:
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: obsidian-ai-chromadb
    ports:
      - '8000:8000'
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/heartbeat']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - obsidian-ai

networks:
  obsidian-ai:
    driver: bridge

volumes:
  chromadb_data:
